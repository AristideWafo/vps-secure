[defaults]
inventory           = inventories/dev/hosts.yml
roles_path          = roles
remote_user         = ubuntu
private_key_file    = ~/.ssh/id_rsa
# Host key checking stays ON (Ansible default). vpssecure init pins the
# host key it saw on first contact to inventories/<env>/known_hosts (see
# ansible_ssh_common_args in the generated hosts.yml) so a later mismatch
# — e.g. a MITM, or a server rebuilt without telling you — hard-fails the
# connection instead of silently trusting whatever key answers now.
retry_files_enabled = False
stdout_callback     = default
result_format       = yaml
interpreter_python  = auto_silent

[privilege_escalation]
become        = true
become_method = sudo
become_user   = root

[ssh_connection]
pipelining              = True
ssh_args                = -o ControlMaster=auto -o ControlPersist=60s
control_path_dir        = /tmp/ansible-cp
