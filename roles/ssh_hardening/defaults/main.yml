---
# Section toggles
ssh_hardening_configure_ssh: true
ssh_hardening_configure_ufw: true
ssh_hardening_configure_fail2ban: true

# SSH core
ssh_hardening_port: 2222
ssh_hardening_permit_root_login: "no"
ssh_hardening_password_authentication: "no"
# Before flipping PasswordAuthentication to "no", verify a key-based SSH
# connection actually succeeds using the same credentials this play is
# already connecting with. Catches a deployed-but-wrong key (e.g. the
# private key on the control node doesn't match what was authorized)
# before it becomes a lockout. Only meaningful when disabling password
# auth; skip only if you understand the risk.
ssh_hardening_verify_key_before_disabling_password: true

# Dead-man's-switch: before sshd_config is rewritten, back it up and schedule
# a one-shot systemd timer that restores it and restarts sshd if nothing
# disarms the timer within ssh_hardening_rollback_timeout. A crash, a wrong
# config that still passes `sshd -t`, or a closed cloud firewall all self-heal
# instead of leaving the server unreachable. `vpssecure harden --apply` disarms
# it automatically once it confirms the new port actually works.
ssh_hardening_enable_rollback_timer: true
ssh_hardening_rollback_timeout: "5min"
ssh_hardening_rollback_backup_path: /etc/ssh/sshd_config.vpssecure-backup
ssh_hardening_pubkey_authentication: "yes"
ssh_hardening_permit_empty_passwords: "no"
ssh_hardening_challenge_response: "no"
ssh_hardening_use_pam: "yes"
ssh_hardening_x11_forwarding: "no"
ssh_hardening_allow_agent_forwarding: "no"
ssh_hardening_allow_tcp_forwarding: "no"
ssh_hardening_max_auth_tries: 3
ssh_hardening_max_sessions: 5
ssh_hardening_login_grace_time: 30

# Session keepalive
ssh_hardening_client_alive_interval: 300
ssh_hardening_client_alive_count_max: 2

# Logging
ssh_hardening_log_level: "VERBOSE"
ssh_hardening_syslog_facility: "AUTH"

# Access control
ssh_hardening_allow_groups: []
ssh_hardening_allow_users: []

# Crypto
ssh_hardening_kex_algorithms:
  - curve25519-sha256
  - curve25519-sha256@libssh.org
  - diffie-hellman-group14-sha256
  - diffie-hellman-group16-sha512

ssh_hardening_ciphers:
  - chacha20-poly1305@openssh.com
  - aes256-gcm@openssh.com
  - aes128-gcm@openssh.com

ssh_hardening_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com

# UFW
ssh_hardening_ufw_policy_incoming: deny
ssh_hardening_ufw_policy_outgoing: allow
ssh_hardening_ufw_rules:
  - { rule: limit, port: "{{ ssh_hardening_port }}", proto: tcp }
  - { rule: allow, port: 80,  proto: tcp }
  - { rule: allow, port: 443, proto: tcp }

# Fail2ban
ssh_hardening_fail2ban_backend: systemd
ssh_hardening_fail2ban_max_retry: 5
ssh_hardening_fail2ban_ban_time: 3600
ssh_hardening_fail2ban_find_time: 600
ssh_hardening_fail2ban_ignore_ips:
  - 127.0.0.1/8
  - ::1
