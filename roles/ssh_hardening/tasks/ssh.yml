---
- name: ssh_hardening | ensure openssh-server is installed
  ansible.builtin.package:
    name: openssh-server
    state: present

- name: ssh_hardening | deploy sshd_config
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: sshd -t -f %s
  notify: ssh_hardening | restart sshd

- name: ssh_hardening | ensure sshd is enabled and running
  ansible.builtin.service:
    name: sshd
    state: started
    enabled: true
